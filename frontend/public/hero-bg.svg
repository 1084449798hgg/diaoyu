<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 460" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2f3e"/>
      <stop offset="0.42" stop-color="#145a6e"/>
      <stop offset="0.72" stop-color="#c97a4a"/>
      <stop offset="0.92" stop-color="#e8a35c"/>
      <stop offset="1" stop-color="#f2c179"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b8" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#f7c876" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f7c876" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d6a72"/>
      <stop offset="0.25" stop-color="#14424f"/>
      <stop offset="1" stop-color="#0a2f3e"/>
    </linearGradient>
    <linearGradient id="reflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7cd85" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f7cd85" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect x="0" y="0" width="390" height="300" fill="url(#sky)"/>

  <!-- 太阳光晕 + 太阳 -->
  <circle cx="288" cy="238" r="86" fill="url(#sunGlow)"/>
  <circle cx="288" cy="238" r="30" fill="#ffd98a"/>
  <circle cx="288" cy="238" r="30" fill="#fff3d0" opacity="0.55"/>

  <!-- 云条 -->
  <g fill="#f7c876" opacity="0.28">
    <ellipse cx="96" cy="72" rx="58" ry="5"/>
    <ellipse cx="150" cy="98" rx="40" ry="4"/>
    <ellipse cx="300" cy="120" rx="52" ry="4.5"/>
    <ellipse cx="70" cy="150" rx="34" ry="3.5"/>
  </g>
  <g fill="#ffe9b8" opacity="0.2">
    <ellipse cx="240" cy="180" rx="70" ry="5"/>
    <ellipse cx="330" cy="205" rx="46" ry="4"/>
  </g>

  <!-- 飞鸟 -->
  <g stroke="#08222d" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M84 96 q4 -5 8 0 q4 -5 8 0"/>
    <path d="M110 82 q3.5 -4.5 7 0 q3.5 -4.5 7 0"/>
    <path d="M132 104 q3 -4 6 0 q3 -4 6 0"/>
  </g>

  <!-- 远山两层 -->
  <path d="M0 300 L0 214 L38 178 L74 210 L108 168 L150 216 L196 172 L238 220 L286 184 L330 224 L390 196 L390 300 Z" fill="#0d3a49" opacity="0.55"/>
  <path d="M0 300 L0 248 L52 216 L96 252 L142 222 L196 258 L250 228 L300 260 L348 236 L390 256 L390 300 Z" fill="#0a2f3e" opacity="0.85"/>

  <!-- 湖面 -->
  <rect x="0" y="300" width="390" height="160" fill="url(#lake)"/>

  <!-- 太阳倒影光带 -->
  <rect x="252" y="300" width="72" height="150" fill="url(#reflect)"/>
  <g fill="#ffe9b8" opacity="0.35">
    <ellipse cx="288" cy="312" rx="34" ry="2.6"/>
    <ellipse cx="288" cy="328" rx="26" ry="2.2"/>
    <ellipse cx="288" cy="346" rx="30" ry="2.4"/>
    <ellipse cx="288" cy="366" rx="22" ry="2"/>
    <ellipse cx="288" cy="388" rx="27" ry="2.2"/>
    <ellipse cx="288" cy="412" rx="19" ry="1.8"/>
  </g>

  <!-- 湖面波纹 -->
  <g stroke="#bfe0e8" fill="none" stroke-linecap="round">
    <path d="M18 322 q22 -4 44 0 t44 0 t44 0" stroke-width="1.6" opacity="0.22"/>
    <path d="M196 336 q24 -4 48 0 t48 0" stroke-width="1.5" opacity="0.18"/>
    <path d="M40 352 q26 -4 52 0 t52 0 t52 0" stroke-width="1.7" opacity="0.15"/>
    <path d="M150 372 q24 -4 48 0 t48 0 t48 0" stroke-width="1.6" opacity="0.13"/>
    <path d="M20 398 q28 -4 56 0 t56 0 t56 0" stroke-width="1.8" opacity="0.11"/>
    <path d="M110 428 q30 -4 60 0 t60 0" stroke-width="1.8" opacity="0.09"/>
  </g>

  <!-- 钓鱼人剪影（右下岸石） -->
  <g fill="#061f29">
    <!-- 岸石 -->
    <path d="M282 460 L282 330 q0 -14 16 -16 l14 -2 q16 -2 20 10 l8 26 q2 8 -6 10 L292 362 Z" opacity="0.96"/>
    <!-- 人：斗笠 + 坐姿 -->
    <path d="M322 300 q-13 0 -20 6 l-4 5 q-1 3 2 4 l6 2 q2 1 2 4 l1 14 q0 4 4 4 l18 0 q4 0 4 -4 l1 -14 q0 -3 2 -4 l6 -2 q3 -1 2 -4 l-4 -5 q-7 -6 -20 -6 Z"/>
    <ellipse cx="322" cy="296" rx="17" ry="4.5"/>
    <path d="M322 288 q-9 0 -13 5 q-2 3 1 3 l24 0 q3 0 1 -3 q-4 -5 -13 -5 Z"/>
    <!-- 鱼竿 -->
    <path d="M340 318 L392 236" stroke="#061f29" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- 鱼线 + 坠 -->
    <path d="M392 236 q6 22 -2 40" stroke="#061f29" stroke-width="1" fill="none" opacity="0.75"/>
    <circle cx="390" cy="278" r="2" opacity="0.75"/>
  </g>

  <!-- 水草芦苇剪影（左下） -->
  <g stroke="#061f29" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M26 460 q-2 -34 6 -58"/>
    <path d="M34 460 q4 -28 -2 -48"/>
    <path d="M44 460 q-3 -22 4 -38"/>
    <path d="M54 460 q5 -18 -1 -30"/>
  </g>
  <path d="M22 404 q6 -14 2 -26 q10 8 8 24 Z" fill="#061f29" opacity="0.9"/>
  <path d="M52 396 q-5 -12 -1 -22 q-9 7 -7 22 Z" fill="#061f29" opacity="0.9"/>
</svg>
